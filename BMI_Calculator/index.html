<!DOCTYPE html>
<html lang="en">
  <head>
    <title>BMI Calculator</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="stylesheet" href="style.css" />
  
  </head>

  <body>
    <nav>
      <a href="/" aria-current="page">Home</a>
      <a href="/page2.html">Other page</a>
    </nav>

    <main>
      <div class="container">
        <h1>BMI Calculator</h1>

        <form>
          <div class="input-group">
            <label for="height">Height (cm)</label>
            <input type="number" id="height" placeholder="Enter your height in cm">
          </div>

          <div class="input-group">
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" placeholder="Enter your weight in kg">
          </div>

          <button style="color:green" type="submit">Calculate BMI</button>
        </form>

        <h2 class="result">Your BMI will appear here</h2>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
